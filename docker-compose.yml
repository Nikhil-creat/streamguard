services:
  kafka:
    image: bitnami/kafka:3.7
    environment: [KAFKA_CFG_NODE_ID=0, KAFKA_CFG_PROCESS_ROLES=controller,broker, "KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093", "KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093", KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER, "KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092"]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment: {MINIO_ROOT_USER: admin, MINIO_ROOT_PASSWORD: change-me-123}
    ports: ["9001:9001"]
  qdrant:
    image: qdrant/qdrant
    ports: ["6333:6333"]
  producer:
    build: ./producer
    depends_on: [kafka]
  processor:
    build: ./processor
    depends_on: [kafka, minio]
    environment: {KAFKA: "kafka:9092", DELTA_PATH: "s3://lake/bronze/txn", AWS_ENDPOINT_URL: "http://minio:9000", AWS_ACCESS_KEY_ID: admin, AWS_SECRET_ACCESS_KEY: change-me-123, AWS_ALLOW_HTTP: "true"}
  api:
    build: ./api
    depends_on: [qdrant]
    ports: ["8000:8000"]
    environment: {QDRANT: "http://qdrant:6333", ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"}
  airflow:
    image: apache/airflow:2.9.2
    command: standalone
    volumes: ["./airflow/dags:/opt/airflow/dags", "./dbt:/opt/dbt"]
    ports: ["8080:8080"]
  prometheus:
    image: prom/prometheus
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml"]
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana
    ports: ["3000:3000"]
